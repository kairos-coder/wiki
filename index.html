<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scriptorium — The Order of Olympus</title>
<style>
:root {
  --parchment: #f4e4c1;
  --parchment-dark: #e8d5a3;
  --ink: #2d1f14;
  --ink-light: #5a4a3a;
  --rubric: #8b3a3a;
  --gold: #b8942e;
  --margin: #a0856b;
  --border: #d4c4a0;
  --terminal-bg: #1a120b;
  --terminal-text: #c9a23b;
  --terminal-dim: #6b5a3a;
  --terminal-green: #7eb8a0;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #1a120b;
  color: var(--ink);
  font-family: 'Georgia', 'Times New Roman', serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
}

.scriptorium {
  max-width: 800px;
  width: 100%;
  margin: 40px 20px;
  display: flex;
  flex-direction: column;
  gap: 0;
}

/* ── HEADER ── */
.page-header {
  background: var(--parchment);
  border-bottom: 3px double var(--gold);
  padding: 24px 32px;
  text-align: center;
  box-shadow: 0 0 60px rgba(0,0,0,0.5);
}

.page-header .studio {
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--margin);
  margin-bottom: 2px;
}

.page-header .order {
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--rubric);
  margin-bottom: 6px;
}

.page-header h1 {
  font-size: 24px;
  color: var(--ink);
  font-weight: normal;
  letter-spacing: 1px;
}

.page-header .tenders {
  font-size: 11px;
  color: var(--margin);
  font-style: italic;
  margin-top: 4px;
}

/* ── ARCHIVE PANE ── */
.archive-pane {
  background: var(--parchment);
  box-shadow: 0 0 60px rgba(0,0,0,0.5);
  flex: 1;
  min-height: 300px;
  max-height: 55vh;
  overflow-y: auto;
}

.archive-pane .breadcrumb {
  padding: 10px 24px;
  font-size: 11px;
  border-bottom: 1px solid var(--border);
  color: var(--margin);
  background: var(--parchment-dark);
  position: sticky;
  top: 0;
  z-index: 2;
}

.archive-pane .breadcrumb a {
  color: var(--rubric);
  text-decoration: none;
}

.archive-pane .breadcrumb a:hover { color: var(--ink); }

.archive-pane .folio-content {
  padding: 24px;
}

.archive-pane .folio-content iframe {
  width: 100%;
  border: none;
  min-height: 400px;
}

.archive-pane .loading {
  text-align: center;
  padding: 60px 24px;
  color: var(--margin);
  font-style: italic;
}

/* ── TERMINAL ── */
.terminal {
  background: var(--terminal-bg);
  border: 1px solid #2a1f14;
  box-shadow: 0 0 60px rgba(0,0,0,0.5);
  font-family: 'Courier New', monospace;
}

.terminal-output {
  padding: 14px 18px;
  min-height: 100px;
  max-height: 25vh;
  overflow-y: auto;
  font-size: 12px;
  line-height: 1.6;
  color: var(--terminal-dim);
}

.terminal-output .line { margin-bottom: 2px; }
.terminal-output .cmd { color: var(--gold); }
.terminal-output .result { color: var(--terminal-green); }
.terminal-output .warn { color: #c9a23b; }
.terminal-output .error { color: #c06060; }
.terminal-output .scribe-name { color: #7eb8a0; font-weight: bold; }

.terminal-input-line {
  display: flex;
  align-items: center;
  padding: 8px 18px;
  border-top: 1px solid #2a1f14;
  background: #0d0a06;
}

.terminal-prompt {
  color: var(--rubric);
  margin-right: 8px;
  font-weight: bold;
  font-size: 13px;
  white-space: nowrap;
}

.terminal-input-line input {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--terminal-text);
  font-family: 'Courier New', monospace;
  font-size: 13px;
  outline: none;
  caret-color: var(--gold);
}

.terminal-input-line input::placeholder {
  color: #3a2f1f;
}

/* ── SCROLLBAR ── */
.archive-pane::-webkit-scrollbar,
.terminal-output::-webkit-scrollbar { width: 5px; }
.archive-pane::-webkit-scrollbar-track { background: var(--parchment); }
.archive-pane::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.terminal-output::-webkit-scrollbar-track { background: var(--terminal-bg); }
.terminal-output::-webkit-scrollbar-thumb { background: #2a1f14; border-radius: 2px; }

@media (max-width: 600px) {
  .scriptorium { margin: 0; }
  .archive-pane { max-height: 40vh; }
  .terminal-output { max-height: 20vh; }
}
</style>
</head>
<body>

<div class="scriptorium">

  <!-- HEADER -->
  <div class="page-header">
    <div class="studio">Ealdforn Studios presents</div>
    <div class="order">The Order of Olympus</div>
    <h1>Scriptorium</h1>
    <div class="tenders">Tended by the word-keepers &amp; wyrd-waerds</div>
  </div>

  <!-- ARCHIVE PANE -->
  <div class="archive-pane" id="archivePane">
    <div class="breadcrumb" id="breadcrumb">
      <a href="#" onclick="loadFolio('catalogue'); return false;">Catalogue</a>
      <span id="breadcrumbPath"></span>
    </div>
    <div class="folio-content" id="folioContent">
      <div class="loading">Consulting the archive...</div>
    </div>
  </div>

  <!-- TERMINAL -->
  <div class="terminal">
    <div class="terminal-output" id="terminalOutput">
      <div class="line result">✦ The scriptorium is still. The quills wait.</div>
      <div class="line">Type <span class="cmd">help</span> to see what the scribes can do.</div>
    </div>
    <div class="terminal-input-line">
      <span class="terminal-prompt">scriptorium&gt;</span>
      <input type="text" id="terminalInput" placeholder="speak to the scribes..." autofocus>
    </div>
  </div>

</div>

<script>
// ════════════════════════════════════════
// SCRIPTORIUM — The Order of Olympus
// Archive lectern + Scribe terminal
// Loads .html folios inline via fetch()
// ════════════════════════════════════════

var WIKI_BASE = '';
var currentFolio = null;
var terminalHistory = [];
var historyIndex = -1;

// ── FOLIO ROUTING ──
// Maps short names to file paths
var FOLIO_MAP = {
  'catalogue': 'catalogue.html',
  'chronicle': 'chronicle.html',
  'pantheon': 'pantheon.html',
  'artemis': 'pantheon/artemis.html',
  'apollo': 'pantheon/apollo.html',
  'athena': 'pantheon/athena.html',
  'demeter': 'pantheon/demeter.html',
  'gaia': 'pantheon/gaia.html',
  'sister-ds': 'monastery/sister-ds.html',
  'sister-tempura': 'halu/sister-tempura.html'
};

// ═══ INIT ═══
function init() {
  var hash = window.location.hash.replace('#', '');
  var folio = hash || 'catalogue';
  loadFolio(folio);

  var input = document.getElementById('terminalInput');
  input.addEventListener('keydown', handleTerminalKey);
  input.focus();

  document.getElementById('archivePane').addEventListener('click', function() {
    input.focus();
  });
}

// ═══ FOLIO LOADING (inline via fetch) ═══
async function loadFolio(folioName) {
  var contentEl = document.getElementById('folioContent');
  contentEl.innerHTML = '<div class="loading">Turning the page...</div>';

  // Resolve short name to file path
  var filePath = FOLIO_MAP[folioName] || folioName;
  if (!filePath.endsWith('.html')) filePath += '.html';

  try {
    var response = await fetch(WIKI_BASE + filePath);
    if (!response.ok) {
      contentEl.innerHTML = '<p style="color:var(--rubric);padding:24px;">This folio has not yet been copied. The scribes may not have reached it.<br><br><small>Looked for: ' + filePath + '</small></p>';
      return;
    }

    var html = await response.text();
    
    // Extract just the body content (strip the <html><head> wrapper)
    var bodyMatch = html.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
    var bodyContent = bodyMatch ? bodyMatch[1] : html;
    
    // Extract styles from head
    var headMatch = html.match(/<head[^>]*>([\s\S]*?)<\/head>/i);
    var headContent = headMatch ? headMatch[1] : '';
    var styleMatch = headContent.match(/<style[^>]*>([\s\S]*?)<\/style>/i);
    var styles = styleMatch ? '<style>' + styleMatch[1] + '</style>' : '';

    contentEl.innerHTML = styles + bodyContent;
    currentFolio = folioName;
    window.location.hash = folioName;

    // Update breadcrumb
    document.getElementById('breadcrumbPath').textContent = ' / ' + folioName;
    document.getElementById('archivePane').scrollTop = 0;

  } catch (err) {
    contentEl.innerHTML = '<p style="color:var(--rubric);padding:24px;">The archive resists consultation.<br><br><small>' + err.message + '</small></p>';
  }
}

// ═══ TERMINAL ═══
function handleTerminalKey(e) {
  var input = document.getElementById('terminalInput');

  if (e.key === 'Enter') {
    var cmd = input.value.trim();
    if (cmd) {
      terminalHistory.push(cmd);
      historyIndex = terminalHistory.length;
      executeCommand(cmd);
    }
    input.value = '';
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (historyIndex > 0) {
      historyIndex--;
      input.value = terminalHistory[historyIndex];
    }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (historyIndex < terminalHistory.length - 1) {
      historyIndex++;
      input.value = terminalHistory[historyIndex];
    } else {
      historyIndex = terminalHistory.length;
      input.value = '';
    }
  }
}

function terminalPrint(text, className) {
  var output = document.getElementById('terminalOutput');
  var line = document.createElement('div');
  line.className = 'line ' + (className || '');
  line.innerHTML = text;
  output.appendChild(line);
  output.scrollTop = output.scrollHeight;
}

function terminalPrintCmd(cmd) {
  terminalPrint('<span class="cmd">scriptorium&gt;</span> ' + cmd, 'cmd');
}

// ═══ COMMANDS ═══
async function executeCommand(raw) {
  terminalPrintCmd(raw);
  var parts = raw.split(/\s+/);
  var cmd = parts[0].toLowerCase();
  var args = parts.slice(1);

  switch (cmd) {
    case 'help':
      terminalPrint('✦ <span class="scribe-name">SCRIPTORIUM COMMANDS</span> ✦', 'result');
      terminalPrint('');
      terminalPrint('<span class="cmd">folio &lt;name&gt;</span> — Open a folio (catalogue, chronicle, artemis, etc.)', '');
      terminalPrint('<span class="cmd">folio catalogue</span> — Return to the Catalogue', '');
      terminalPrint('<span class="cmd">folios</span> — List available folios', '');
      terminalPrint('');
      terminalPrint('<span class="cmd">scribe copyist --all</span> — Transcribe all Olympian repos', '');
      terminalPrint('<span class="cmd">scribe copyist &lt;name&gt;</span> — Transcribe one Olympian', '');
      terminalPrint('<span class="cmd">scribe copyist --list</span> — List registered repos', '');
      terminalPrint('<span class="cmd">scribe indexer</span> — Rebuild the Catalogue', '');
      terminalPrint('<span class="cmd">scribe chronologer</span> — Update the Chronicle', '');
      terminalPrint('');
      terminalPrint('<span class="cmd">clear</span> — Clear the terminal', '');
      terminalPrint('<span class="cmd">help</span> — This invocation', '');
      break;

    case 'clear':
      document.getElementById('terminalOutput').innerHTML = '';
      break;

    case 'folio':
    case 'open':
      if (args[0]) {
        loadFolio(args[0]);
        terminalPrint('Opened folio: <span class="result">' + args[0] + '</span>', 'result');
      } else {
        terminalPrint('Which folio? Try <span class="cmd">folio catalogue</span>.', 'warn');
      }
      break;

    case 'folios':
      terminalPrint('Available folios:', 'result');
      var keys = Object.keys(FOLIO_MAP).sort();
      for (var i = 0; i < keys.length; i++) {
        terminalPrint('  <span class="cmd">' + keys[i] + '</span> — ' + FOLIO_MAP[keys[i]], '');
      }
      break;

    case 'scribe':
      if (args[0] === 'copyist') {
        await runCopyist(args.slice(1));
      } else if (args[0] === 'indexer') {
        terminalPrint('✦ <span class="scribe-name">Indexer</span> would rebuild the Catalogue from discovered folios.', 'result');
        terminalPrint('  (Run <span class="cmd">scribe copyist</span> first to generate folios, then <span class="cmd">folio catalogue</span> to review.)', '');
      } else if (args[0] === 'chronologer') {
        terminalPrint('✦ <span class="scribe-name">Chronologer</span> would update the Chronicle with commit history.', 'result');
        terminalPrint('  (The Chronicle is currently maintained manually. API integration pending.)', '');
      } else {
        terminalPrint('Unknown scribe. Known: <span class="cmd">copyist</span>', 'warn');
      }
      break;

    default:
      terminalPrint('Unknown command. Type <span class="cmd">help</span>.', 'warn');
  }
}

// ═══ SCRIBE: COPYIST (abbreviated — keeps your existing copyist code) ═══
// [Your existing SOURCES, FEASTS, fetchRepoTree, isTranscribable, runCopyist, etc. go here]
// I'm including a minimal version so the terminal isn't broken:

var SOURCES = [
  { id: 'artemis', name: 'Artemis', repo: 'kairos-coder/artemis', branch: 'main', namespace: 'pantheon' },
  { id: 'apollo', name: 'Apollo', repo: 'kairos-coder/apollo', branch: 'main', namespace: 'pantheon' },
  { id: 'athena', name: 'Athena', repo: 'kairos-coder/athena', branch: 'main', namespace: 'pantheon' },
  { id: 'demeter', name: 'Demeter', repo: 'kairos-coder/demeter', branch: 'main', namespace: 'pantheon' }
];

var FEASTS = [
  'the Feast of the Second Rise',
  'the Vigil of the Unrisen Dough',
  'the Feast of the Phase-Lock',
  'the Day of the Silver Bow',
  'the Feast of the Gilded Crust',
  'the Vigil of the Still Night'
];

function getFeast() {
  return FEASTS[Math.floor(Math.random() * FEASTS.length)];
}

async function runCopyist(args) {
  if (args[0] === '--list') {
    terminalPrint('Registered Olympian repositories:', 'result');
    for (var i = 0; i < SOURCES.length; i++) {
      terminalPrint('  <span class="cmd">' + SOURCES[i].id + '</span> — ' + SOURCES[i].name + ' (' + SOURCES[i].repo + ')', '');
    }
    return;
  }

  var targets = [];
  if (args[0] === '--all' || args.length === 0) {
    targets = SOURCES;
  } else {
    for (var i = 0; i < args.length; i++) {
      var found = SOURCES.find(function(s) { return s.id === args[i]; });
      if (found) targets.push(found);
      else terminalPrint('Unknown source: <span class="warn">' + args[i] + '</span>', 'warn');
    }
  }

  if (targets.length === 0) {
    terminalPrint('No sources to transcribe.', 'warn');
    return;
  }

  var feast = getFeast();
  terminalPrint('✦ <span class="scribe-name">Copyist</span> would transcribe on ' + feast + ':', 'result');
  
  for (var t = 0; t < targets.length; t++) {
    terminalPrint('  📁 <span class="cmd">' + targets[t].name + '</span> — would generate pantheon/' + targets[t].id + '.html', '');
  }
  
  terminalPrint('');
  terminalPrint('The full Copyist with GitHub API file discovery is ready. Replace this stub when ready to transcribe.', '');
  terminalPrint('<span class="cmd">folio artemis</span> to view the Artemis folio (when it exists).', '');
}

// ═══ START ═══
init();
</script>
</body>
</html>
